name: Smoke test

# Real syncing happens on the VM (docker-compose loop). Here we just keep the
# OpenProject API contract honest: build the project, run unit tests, and
# fetch one batch of bugs without touching a database.

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/extract-bugs.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC — catches API drift even without code changes.
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

      # projects-customdev.wone-it.ru does not serve the intermediate of its
      # certificate chain, so the runner's default trust store cannot build a
      # path to a root and every smoke fetch died with CERTIFICATE_VERIFY_FAILED.
      # Trusting the intermediate directly is exactly what .cert/bundle.pem does
      # on developer machines; here we assemble the equivalent from certifi plus
      # the one tracked intermediate.
      - name: Build CA bundle for OpenProject's incomplete chain
        run: cat "$(python -m certifi)" .cert/globalsign-intermediate.pem > "$RUNNER_TEMP/ca-bundle.pem"

      - name: Smoke-fetch bugs from OpenProject
        env:
          OPENPROJECTTOKEN: ${{ secrets.OPENPROJECTTOKEN }}
          OPENPROJECT_URL: https://projects-customdev.wone-it.ru
          PROJECT_IDENTIFIER: dom-zhkkh
          REQUESTS_CA_BUNDLE: ${{ runner.temp }}/ca-bundle.pem
        run: python -m src.main --dry-run
