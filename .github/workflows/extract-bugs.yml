name: Extract Bugs from OpenProject

on:
  push:
    paths:
      - 'src/**'
      - 'requirements.txt'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v
      
      - name: Extract bugs from OpenProject
        env:
          OPENPROJECTTOKEN: ${{ secrets.OPENPROJECTTOKEN }}
          OPENPROJECT_URL: https://projects-customdev.wone-it.ru
          PROJECT_IDENTIFIER: dom-zhkkh
        run: |
          python -m src.extractor
      
      - name: Validate output
        run: |
          latest=$(ls -t output/res-*.csv 2>/dev/null | head -1)
          if [ -z "$latest" ]; then
            echo "::error::No CSV files found in output/"
            exit 1
          fi
          lines=$(wc -l < "$latest")
          echo "Latest output: $latest"
          echo "Lines in file: $lines"
          if [ "$lines" -lt 2 ]; then
            echo "::error::CSV file has no data rows"
            exit 1
          fi
          echo "Validation passed: $lines lines (including header)"
