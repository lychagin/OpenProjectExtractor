# Replacement for the image's built-in /code/gunicorn_logging.ini, which ships
# with `[logger_root] level = DEBUG`.
#
# Why: dl_data_api unconditionally starts dl_app_tools.aio_latency_tracking.
# LatencyTracker (dl_data_api/app.py: `await LatencyTracker().run_task()`, no
# env switch to disable it). It emits a DEBUG "Latency stats: ..." line every
# 5s per gunicorn worker — with GUNICORN_WORKERS_COUNT=5 that is ~1 line/s,
# ~700 bytes each, ~60 MB/day, forever, even on a completely idle instance.
# It filled 4.7 GB and took the VM disk to 95% in 2.5 months.
#
# Raising root to INFO drops that spam at the source while keeping request
# logs, profiling records, warnings (including LatencyTracker's own
# "High latency: ..." WARNING) and errors.
#
# Wired in via BI_API_GUNICORN_LOG_CONFIG in docker-compose.prod.yml, so the
# vendored file inside the image is left untouched.

[formatters]
keys = json

[handlers]
keys = stdout

[loggers]
keys = gunicorn,root

[formatter_json]
class = dl_logging.StdoutFormatter

[handler_stdout]
class = logging.StreamHandler
formatter = json
stream = sys.stdout
level = INFO

[logger_root]
level = INFO
handlers = stdout

[logger_gunicorn]
qualname=gunicorn
propagate=0
level = INFO
handlers = stdout
